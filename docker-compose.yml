services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-telegram-invitations
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Configuración básica
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=ApexTournament2026
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Zona horaria (ajusta según tu ubicación)
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
      # Webhooks - Se actualizará con la URL del túnel
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - apex-network

  # Túnel HTTPS gratuito con Cloudflare (sin registro)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://n8n:5678
    networks:
      - apex-network
    depends_on:
      - n8n

networks:
  apex-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
