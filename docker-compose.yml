services:
  # n8n - Automatización de workflows
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-apex-tournament
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Configuración básica
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # URL pública para webhooks (Cloudflare tunnel)
      - WEBHOOK_URL=https://capture-steering-eau-infringement.trycloudflare.com/
      # Zona horaria
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
      # Webhook settings
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true
      # Telegram Bot Token
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - apex-network

  # Túnel HTTPS gratuito con Cloudflare (expone n8n a internet para webhooks)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate --protocol http2 --url http://n8n:5678
    networks:
      - apex-network
    depends_on:
      - n8n

networks:
  apex-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
