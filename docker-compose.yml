services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-telegram-invitations
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Configuración básica
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # Zona horaria (ajusta según tu ubicación)
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
      # Deshabilitar registro automático de webhook (lo haremos manualmente)
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true
      # Telegram Bot Token
      - TELEGRAM_BOT_TOKEN=8569003047:AAFjJgYBVNCiCYrE5GM5TTphjO7hutCcpPc
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - apex-network

  # Túnel HTTPS gratuito con Cloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate --protocol http2 --url http://n8n:5678
    networks:
      - apex-network
    depends_on:
      - n8n

networks:
  apex-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
