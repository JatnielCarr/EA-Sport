<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#16161d"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00a8cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="2732" height="2732" fill="url(#bgGrad)"/>
  
  <!-- Glow effect -->
  <circle cx="1366" cy="1366" r="400" fill="rgba(0, 212, 255, 0.15)" filter="url(#glow)"/>
  
  <!-- Lightning bolt (centered) -->
  <g transform="translate(1016, 916)">
    <path 
      d="M 400 0 L 150 420 L 300 420 L 180 900 L 550 350 L 350 350 L 480 0 Z" 
      fill="url(#boltGrad)" 
      filter="url(#glow)"
    />
  </g>
  
  <!-- App name -->
  <text 
    x="1366" 
    y="2200" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="120" 
    font-weight="bold" 
    fill="#ffffff"
  >
    ApexTournament
  </text>
</svg>
