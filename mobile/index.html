<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  
  <!-- Viewport optimizado para iPhone 15 con soporte de Safe Areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  
  <!-- iOS Status Bar -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ApexTournament">
  
  <!-- Theme -->
  <meta name="theme-color" content="#0a0a0f">
  <meta name="color-scheme" content="dark">
  
  <!-- App Info -->
  <title>ApexTournament</title>
  <meta name="description" content="Plataforma de torneos de esports - Compite y gana">
  
  <!-- Preconnect para performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Fonts optimizadas -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- App Icons -->
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  
  <!-- Splash Screens para iPhone 15 (2556 x 1179) -->
  <link rel="apple-touch-startup-image" 
        media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
        href="/splash/splash-iphone15.png">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <!-- Capacitor -->
  <script type="module" src="/js/capacitor-init.js"></script>
</head>

<body>
  <!-- Splash Screen Overlay -->
  <div id="splash-overlay" class="splash-overlay">
    <div class="splash-content">
      <div class="splash-logo">
        <i class="fas fa-bolt"></i>
      </div>
      <div class="splash-text">ApexTournament</div>
      <div class="splash-loader"></div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="navbar navbar-mobile">
    <div class="nav-container">
      <a href="#/" class="nav-logo">
        <i class="fas fa-bolt"></i>
        <span>Apex</span>
      </a>

      <div class="nav-actions">
        <button class="search-btn" id="navSearchBtn" aria-label="Buscar">
          <i class="fas fa-search"></i>
        </button>
        <button class="notifications-btn" id="notificationsBtn" aria-label="Notificaciones">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" id="notifBadge">0</span>
        </button>
        <a href="#/perfil" class="profile-btn" aria-label="Perfil">
          <i class="fas fa-user-circle"></i>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content with Safe Area -->
  <main id="app" class="app-content">
    <!-- Content loaded dynamically -->
  </main>

  <!-- Bottom Tab Navigation (iOS Style) -->
  <nav class="tab-bar">
    <a href="#/" class="tab-item active" data-haptic="light">
      <i class="fas fa-home"></i>
      <span>Inicio</span>
    </a>
    <a href="#/torneos" class="tab-item" data-haptic="light">
      <i class="fas fa-trophy"></i>
      <span>Torneos</span>
    </a>
    <a href="#/live" class="tab-item tab-live" data-haptic="medium">
      <i class="fas fa-broadcast-tower"></i>
      <span>Live</span>
    </a>
    <a href="#/clanes" class="tab-item" data-haptic="light">
      <i class="fas fa-shield-alt"></i>
      <span>Clanes</span>
    </a>
    <a href="#/ranking" class="tab-item" data-haptic="light">
      <i class="fas fa-medal"></i>
      <span>Ranking</span>
    </a>
  </nav>

  <!-- Floating QR Button -->
  <button class="fab-qr" id="fabQR" aria-label="Escanear QR" data-haptic="medium">
    <i class="fas fa-qrcode"></i>
  </button>

  <!-- Scripts -->
  <script type="module" src="/js/app.js"></script>
  
  <!-- QR FAB Handler -->
  <script type="module">
    import QRService from '/js/qr-service.js';
    
    const fabQR = document.getElementById('fabQR');
    const qrService = new QRService();
    let isScanning = false;
    
    fabQR.addEventListener('click', async () => {
      if (isScanning) {
        qrService.stopQRScanner();
        fabQR.classList.remove('scanning');
        isScanning = false;
      } else {
        fabQR.classList.add('scanning');
        isScanning = true;
        
        try {
          await qrService.startQRScanner((result) => {
            fabQR.classList.remove('scanning');
            isScanning = false;
            
            // Navigate to QR page and show result
            window.location.hash = '/qr';
            
            // Handle the result
            const parsed = qrService.parseDeepLink(result);
            if (parsed) {
              setTimeout(() => {
                switch (parsed.type) {
                  case 'profile':
                    window.location.hash = `/perfil/${parsed.id}`;
                    break;
                  case 'clan':
                    window.location.hash = `/clanes/${parsed.id}`;
                    break;
                  case 'tournament':
                    window.location.hash = `/torneos/${parsed.id}`;
                    break;
                  case 'match':
                    window.location.hash = `/matches/${parsed.id}/live`;
                    break;
                }
              }, 500);
            }
          });
        } catch (error) {
          fabQR.classList.remove('scanning');
          isScanning = false;
          console.error('QR Scanner error:', error);
        }
      }
    });
    
    // Long press to go to QR page
    let pressTimer;
    fabQR.addEventListener('touchstart', () => {
      pressTimer = setTimeout(() => {
        window.location.hash = '/qr';
      }, 500);
    });
    fabQR.addEventListener('touchend', () => clearTimeout(pressTimer));
    fabQR.addEventListener('touchmove', () => clearTimeout(pressTimer));
  </script>
</body>

</html>
