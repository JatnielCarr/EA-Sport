<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Conectando con Discord...</title>
    <style>
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .loader {
            text-align: center;
        }

        .loader i {
            font-size: 3rem;
            color: #5865F2;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader p {
            margin-top: 16px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="loader">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Conectando con Discord...</p>
    </div>
    <script>
        // Get the authorization code from URL params
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');

        if (error) {
            // User cancelled or error occurred
            if (window.opener) {
                window.opener.postMessage({ type: 'discord-auth', error: error }, '*');
                window.close();
            }
        } else if (code) {
            // Send the code back to the parent window
            if (window.opener) {
                window.opener.postMessage({ type: 'discord-auth', code: code }, '*');
                window.close();
            } else {
                // If opened directly (not in popup), redirect to main app
                window.location.href = '/#/login';
            }
        } else {
            // No code or error, redirect to login
            window.location.href = '/#/login';
        }
    </script>
</body>

</html>
