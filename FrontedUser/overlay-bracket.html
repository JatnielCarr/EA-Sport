<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Tournament — OBS Bracket Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Rajdhani', sans-serif;
            color: #e2e8f0;
            padding: 20px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .bracket-header {
            text-align: center;
            margin-bottom: 16px;
            padding: 8px 24px;
            background: rgba(10, 22, 40, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            display: inline-block;
        }

        .bracket-header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .bracket-header .sub {
            font-size: 11px;
            color: rgba(148, 163, 184, 0.7);
            letter-spacing: 1px;
        }

        .bracket-container {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            min-height: 400px;
        }

        .round {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 200px;
        }

        .round-title {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: rgba(148, 163, 184, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .match-card {
            background: rgba(10, 22, 40, 0.92);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 6px;
            overflow: hidden;
            min-width: 200px;
            transition: all 0.3s ease;
        }

        .match-card.active {
            border-color: #f59e0b;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
            animation: activePulse 2s ease-in-out infinite;
        }

        .match-card.completed {
            border-color: rgba(34, 197, 94, 0.3);
        }

        @keyframes activePulse {
            0%, 100% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.15); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
        }

        .team-row:last-child {
            border-bottom: none;
        }

        .team-row.winner {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
        }

        .team-row.loser {
            opacity: 0.45;
        }

        .team-row .name {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .team-row .score-val {
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }

        .tbd {
            color: rgba(148, 163, 184, 0.4);
            font-style: italic;
        }

        .loading {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            letter-spacing: 2px;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">CARGANDO BRACKET...</div>
    <div id="bracket-header" class="bracket-header" style="display:none;">
        <h1 id="tournament-title">TORNEO</h1>
        <div class="sub" id="tournament-sub">FORMATO • EQUIPOS</div>
    </div>
    <div id="bracket" class="bracket-container" style="display:none;"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const tournamentId = params.get('tournamentId');
        const API_BASE = params.get('api') || 'http://localhost:3000';
        const POLL_INTERVAL = 10000;

        if (!tournamentId) {
            document.getElementById('loading').textContent = '⚠️ Usa ?tournamentId=xxx en la URL';
        } else {
            fetchBracket();
            setInterval(fetchBracket, POLL_INTERVAL);
        }

        async function fetchBracket() {
            try {
                const res = await fetch(`${API_BASE}/tournaments/${tournamentId}/bracket`);
                const data = await res.json();

                if (data.success && data.data) {
                    renderBracket(data.data);
                }
            } catch (err) {
                console.warn('Fetch error:', err);
            }
        }

        function renderBracket(data) {
            const { tournament, matches } = data;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('bracket-header').style.display = 'inline-block';
            document.getElementById('bracket').style.display = 'flex';

            document.getElementById('tournament-title').textContent = tournament?.name || 'TORNEO';
            document.getElementById('tournament-sub').textContent =
                `${tournament?.format?.replace('_', ' ') || ''} • ${tournament?.game?.name || ''}`;

            // Group matches by round
            const rounds = {};
            matches.forEach(m => {
                if (!rounds[m.round]) rounds[m.round] = [];
                rounds[m.round].push(m);
            });

            const container = document.getElementById('bracket');
            container.innerHTML = '';

            const roundNumbers = Object.keys(rounds).sort((a, b) => a - b);
            const totalRounds = roundNumbers.length;

            roundNumbers.forEach((roundNum, idx) => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';

                // Round title
                const title = document.createElement('div');
                title.className = 'round-title';
                if (idx === totalRounds - 1) title.textContent = '🏆 FINAL';
                else if (idx === totalRounds - 2) title.textContent = 'SEMIFINAL';
                else title.textContent = `RONDA ${roundNum}`;
                roundDiv.appendChild(title);

                // Add vertical spacing for later rounds to center them
                if (idx > 0) {
                    roundDiv.style.paddingTop = `${Math.pow(2, idx) * 20}px`;
                    roundDiv.style.gap = `${Math.pow(2, idx) * 20 + 20}px`;
                }

                // Matches in this round
                rounds[roundNum]
                    .sort((a, b) => a.bracket_position - b.bracket_position)
                    .forEach(match => {
                        const card = document.createElement('div');
                        card.className = 'match-card';

                        if (match.status === 'LIVE' || match.status === 'CHECK_IN') card.className += ' active';
                        else if (match.status === 'COMPLETED') card.className += ' completed';

                        const homeWon = match.winner_id && match.winner_id === match.home_team_id;
                        const awayWon = match.winner_id && match.winner_id === match.away_team_id;

                        card.innerHTML = `
                            <div class="team-row ${homeWon ? 'winner' : (awayWon ? 'loser' : '')}">
                                <span class="name">${match.home_team?.name || '<span class="tbd">TBD</span>'}</span>
                                <span class="score-val">${match.status !== 'SCHEDULED' ? match.home_score : '-'}</span>
                            </div>
                            <div class="team-row ${awayWon ? 'winner' : (homeWon ? 'loser' : '')}">
                                <span class="name">${match.away_team?.name || '<span class="tbd">TBD</span>'}</span>
                                <span class="score-val">${match.status !== 'SCHEDULED' ? match.away_score : '-'}</span>
                            </div>
                        `;
                        roundDiv.appendChild(card);
                    });

                container.appendChild(roundDiv);
            });
        }
    </script>
</body>
</html>
